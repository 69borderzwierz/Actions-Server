name: CI

on:
  push:
    branches: [ "playit-only" ]
  pull_request:
    branches: [ "playit-only" ]
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'  # Run every 5 hours

concurrency:
  group: actions-server-playit-only
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.FINE_GRAINED_PAT }}

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug - List directory contents
        run: ls -la

      - name: Run Spigot and ngrok, then edit Discord message
        if: "!contains(github.event.head_commit.message, 'Auto commit every 30 seconds')"
        env:
          FINE_GRAINED_PAT: ${{ secrets.FINE_GRAINED_PAT }}
          REPO: ${{ github.repository }}
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}

          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: "1509718036360335392"
          DISCORD_MESSAGE_ID: "1509718172046196896"
        run: |
          cd $GITHUB_WORKSPACE

          echo "Installing ngrok..."
          curl -sSL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz -o ngrok.tgz
          tar -xzf ngrok.tgz
          chmod +x ngrok

          echo "Authenticating ngrok..."
          ./ngrok config add-authtoken "$NGROK_AUTHTOKEN"

          update_discord_message() {
            SERVER_IP="$1"

            if [ -z "$DISCORD_BOT_TOKEN" ]; then
              echo "DISCORD_BOT_TOKEN is missing; skipping Discord update."
              return 0
            fi

            if [ -z "$DISCORD_CHANNEL_ID" ] || [ -z "$DISCORD_MESSAGE_ID" ]; then
              echo "Discord channel/message ID missing; skipping Discord update."
              return 0
            fi

            MESSAGE_CONTENT="🎮 Minecraft server IP: ${SERVER_IP}"

            echo "Updating Discord message with Minecraft IP..."

            RESPONSE_CODE=$(curl -s -o discord_response.json -w "%{http_code}" \
              -X PATCH "https://discord.com/api/v10/channels/${DISCORD_CHANNEL_ID}/messages/${DISCORD_MESSAGE_ID}" \
              -H "Authorization: ${DISCORD_BOT_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$(jq -nc --arg content "$MESSAGE_CONTENT" '{content: $content}')")

            echo "Discord API HTTP status: $RESPONSE_CODE"

            if [ "$RESPONSE_CODE" -lt 200 ] || [ "$RESPONSE_CODE" -ge 300 ]; then
              echo "Discord update failed:"
              cat discord_response.json || true
            else
              echo "Discord message updated successfully."
            fi
          }

          print_ngrok_ip() {
            echo "Waiting for ngrok tunnel..."
            for i in {1..20}; do
              NGROK_URL=$(curl -s http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[]?.public_url // empty')

              if [ -n "$NGROK_URL" ]; then
                MINECRAFT_IP=$(echo "$NGROK_URL" | sed 's#tcp://##')

                echo "=================================================="
                echo "MINECRAFT SERVER IP: $MINECRAFT_IP"
                echo "Use this in Minecraft: $MINECRAFT_IP"
                echo "Full ngrok URL: $NGROK_URL"
                echo "=================================================="

                update_discord_message "$MINECRAFT_IP"

                return 0
              fi

              echo "ngrok tunnel not ready yet, retrying..."
              sleep 3
            done

            echo "Failed to get ngrok tunnel URL"
            echo "ngrok log:"
            cat ngrok.log || true
            return 1
          }

          start_spigot() {
            echo "Starting Spigot..."
            java -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:+AlwaysPreTouch -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 -XX:G1HeapRegionSize=8M -XX:G1ReservePercent=20 -XX:G1HeapWastePercent=5 -XX:G1MixedGCCountTarget=4 -XX:InitiatingHeapOccupancyPercent=15 -XX:G1MixedGCLiveThresholdPercent=90 -XX:G1RSetUpdatingPauseTimePercent=5 -XX:SurvivorRatio=32 -XX:+PerfDisableSharedMem -XX:MaxTenuringThreshold=1 -Dusing.aikars.flags=https://mcflags.emc.gs -Daikars.new.flags=true -Xms16G -Xmx16G -jar spigot.jar nogui 2>&1 | sed '/login:/s/.*/<REDACTED>/' &
            SPIGOT_PID=$!
            echo "Spigot started with PID $SPIGOT_PID"
          }

          start_ngrok() {
            echo "Starting ngrok TCP tunnel..."
            ./ngrok tcp 25565 --log=stdout > ngrok.log 2>&1 &
            NGROK_PID=$!
            echo "ngrok started with PID $NGROK_PID"

            print_ngrok_ip || true
          }

          commit_and_push() {
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"

            git add -A

            git reset -- ngrok || true
            git reset -- ngrok.tgz || true
            git reset -- ngrok.log || true
            git reset -- discord_response.json || true
            git reset -- logs/ || true
            git reset -- credentials.json || true
            
            if ! git commit -m "Auto commit every 30 seconds [no ci]"; then
              echo "No changes to commit or commit failed"
              return 1
            fi
            
            for i in {1..3}; do
              if git push https://x-access-token:${FINE_GRAINED_PAT}@github.com/${GITHUB_REPOSITORY}.git HEAD:playit-only --force; then
                echo "Push successful on attempt $i"
                return 0
              else
                echo "Push failed on attempt $i, retrying..."
                git pull --rebase || true
              fi
            done
            
            echo "Failed to push after 3 attempts"
            return 1
          }

          create_new_workflow_run() {
            curl -X POST -H "Authorization: token $FINE_GRAINED_PAT" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${REPO}/actions/workflows/blank.yml/dispatches" \
              -d '{"ref":"playit-only"}'

            echo "New workflow run created"
          }

          start_spigot
          start_ngrok

          START_TIME=$(date +%s)

          (sleep 20 && rm -f credentials.json) &

          while true; do
            if ! commit_and_push; then
              echo "Commit and push failed, continuing without stopping the workflow"
            fi
            
            CURRENT_TIME=$(date +%s)
            ELAPSED_TIME=$((CURRENT_TIME - START_TIME))
            
            if ! kill -0 $SPIGOT_PID 2>/dev/null; then
              echo "Spigot process has stopped. Restarting Spigot..."
              start_spigot
            fi

            if ! kill -0 $NGROK_PID 2>/dev/null || [ $ELAPSED_TIME -ge 18000 ]; then
              if ! kill -0 $NGROK_PID 2>/dev/null; then
                echo "ngrok tunnel process has stopped."
              else
                echo "Workflow has been running for 5 hours."
              fi

              echo "Creating new workflow run and exiting current one."
              create_new_workflow_run
              exit 0
            fi
            
            sleep 30
          done

      - name: Rerun workflow if previous step failed
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.FINE_GRAINED_PAT }}
        run: |
          curl -X POST -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/blank.yml/dispatches" \
            -d '{"ref":"playit-only"}'

          echo "Workflow rerun triggered due to previous step failure"
