name: CI

on:
  push:
    branches: [ "playit-only" ]
  pull_request:
    branches: [ "playit-only" ]
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: actions-server-playit-only
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.FINE_GRAINED_PAT }}

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug - List directory contents
        run: ls -la

      - name: Run Minecraft server with playit
        if: ${{ !contains(github.event.head_commit.message, 'Auto commit every 30 seconds') }}
        env:
          FINE_GRAINED_PAT: ${{ secrets.FINE_GRAINED_PAT }}
          REPO: ${{ github.repository }}
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          cd "$GITHUB_WORKSPACE"

          echo "Preparing Minecraft server..."
          echo "eula=true" > eula.txt

          if [ ! -f server.properties ]; then
            touch server.properties
          fi

          sed -i '/^server-port=/d' server.properties || true
          sed -i '/^server-ip=/d' server.properties || true
          sed -i '/^enable-status=/d' server.properties || true
          sed -i '/^query.port=/d' server.properties || true

          echo "server-port=25565" >> server.properties
          echo "server-ip=" >> server.properties
          echo "enable-status=true" >> server.properties
          echo "query.port=25565" >> server.properties

          echo "Preparing playit..."

          if [ ! -f playit-linux-amd64 ]; then
            echo "playit-linux-amd64 not found, downloading latest..."
            wget -O playit-linux-amd64 https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64
          fi

          chmod +x playit-linux-amd64

          if [ -z "$PLAYIT_SECRET" ]; then
            echo "ERROR: PLAYIT_SECRET is missing."
            exit 1
          fi

          echo "$PLAYIT_SECRET" > playit.toml
          chmod 600 playit.toml

          find_server_jar() {
            if [ -f "spigot.jar" ]; then
              echo "spigot.jar"
              return 0
            fi

            JAR_FILE=$(find . -maxdepth 1 -name "*.jar" | head -n 1 | sed 's#^\./##')

            if [ -z "$JAR_FILE" ]; then
              echo "ERROR: No .jar file found in repo root!" >&2
              exit 1
            fi

            echo "$JAR_FILE"
          }

          start_minecraft() {
            SERVER_JAR=$(find_server_jar)

            echo "Starting Minecraft server using jar: $SERVER_JAR"

            java -XX:+UseG1GC \
              -XX:+ParallelRefProcEnabled \
              -XX:MaxGCPauseMillis=200 \
              -XX:+UnlockExperimentalVMOptions \
              -XX:+DisableExplicitGC \
              -XX:+AlwaysPreTouch \
              -XX:G1NewSizePercent=30 \
              -XX:G1MaxNewSizePercent=40 \
              -XX:G1HeapRegionSize=8M \
              -XX:G1ReservePercent=20 \
              -XX:G1HeapWastePercent=5 \
              -XX:G1MixedGCCountTarget=4 \
              -XX:InitiatingHeapOccupancyPercent=15 \
              -XX:G1MixedGCLiveThresholdPercent=90 \
              -XX:G1RSetUpdatingPauseTimePercent=5 \
              -XX:SurvivorRatio=32 \
              -XX:+PerfDisableSharedMem \
              -XX:MaxTenuringThreshold=1 \
              -Dusing.aikars.flags=https://mcflags.emc.gs \
              -Daikars.new.flags=true \
              -Xms2G \
              -Xmx6G \
              -jar "$SERVER_JAR" nogui 2>&1 | sed '/login:/s/.*/<REDACTED>/' | tee server-live.log &

            SERVER_PID=$!
            echo "Minecraft server started with PID $SERVER_PID"
          }

          start_playit() {
            echo "Starting playit using playit.toml from PLAYIT_SECRET..."

            ./playit-linux-amd64 2>&1 | sed '/login:/s/.*/<REDACTED>/' | tee playit.log &

            PLAYIT_PID=$!
            echo "playit started with PID $PLAYIT_PID"

            sleep 15

            echo "=================================================="
            echo "PLAYIT LOGS:"
            tail -n 80 playit.log || true
            echo "=================================================="
            echo "Make sure your playit tunnel points to:"
            echo "127.0.0.1:25565"
            echo "=================================================="
          }

          commit_and_push() {
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"

            git add -A

            git reset -- playit.toml || true
            git reset -- playit.log || true
            git reset -- server-live.log || true
            git reset -- tunnel-config.yml || true
            git reset -- credentials.json || true
            git reset -- logs/ || true

            if ! git commit -m "Auto commit every 30 seconds [no ci]"; then
              echo "No changes to commit or commit failed"
              return 1
            fi

            for i in {1..3}; do
              if git push https://x-access-token:${FINE_GRAINED_PAT}@github.com/${GITHUB_REPOSITORY}.git HEAD:playit-only --force; then
                echo "Push successful on attempt $i"
                return 0
              else
                echo "Push failed on attempt $i, retrying..."
                git pull --rebase || true
              fi
            done

            echo "Failed to push after 3 attempts"
            return 1
          }

          create_new_workflow_run() {
            curl -X POST -H "Authorization: token $FINE_GRAINED_PAT" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${REPO}/actions/workflows/blank.yml/dispatches" \
              -d '{"ref":"playit-only"}'

            echo "New workflow run created"
          }

          start_minecraft
          sleep 20
          start_playit

          START_TIME=$(date +%s)

          while true; do
            if ! commit_and_push; then
              echo "Commit and push failed, continuing without stopping the workflow"
            fi

            CURRENT_TIME=$(date +%s)
            ELAPSED_TIME=$((CURRENT_TIME - START_TIME))

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Minecraft server stopped. Restarting..."
              start_minecraft
              sleep 20
            fi

            if ! kill -0 "$PLAYIT_PID" 2>/dev/null; then
              echo "playit stopped. Restarting..."
              start_playit
            fi

            if [ "$ELAPSED_TIME" -ge 18000 ]; then
              echo "Workflow has been running for 5 hours."
              echo "Creating new workflow run and exiting current one."
              create_new_workflow_run
              exit 0
            fi

            echo "Last server logs:"
            tail -n 20 server-live.log || true

            echo "Last playit logs:"
            tail -n 20 playit.log || true

            sleep 30
          done

      - name: Rerun workflow if previous step failed
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.FINE_GRAINED_PAT }}
        run: |
          curl -X POST -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/blank.yml/dispatches" \
            -d '{"ref":"playit-only"}'

          echo "Workflow rerun triggered due to previous step failure"
