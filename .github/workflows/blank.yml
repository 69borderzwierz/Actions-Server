name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: true
          token: ${{ secrets.FINE_GRAINED_PAT }}

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "22"
          distribution: "graalvm"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add Cloudflare repository
        run: |
          sudo mkdir -p --mode=0755 /usr/share/keyrings
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared jammy main' | sudo tee /etc/apt/sources.list.d/cloudflared.list
          sudo apt-get update

      - name: Install cloudflared
        run: |
          sudo apt-get install -y cloudflared jq

      - name: Debug - List directory contents
        run: ls -la

      - name: Run Spigot and cloudflared
        if: "!contains(github.event.head_commit.message, 'Auto commit every 30 seconds [no ci]')"
        continue-on-error: true
        env:
          FINE_GRAINED_PAT: ${{ secrets.FINE_GRAINED_PAT }}
          REPO: ${{ github.repository }}
          CF_TUNNEL_CERT: ${{ secrets.CF_CERT }}
          CF_TUNNEL_UUID: ${{ secrets.CF_TUNNEL_UUID_1 }}
          CF_TUNNEL_UUID_CONTENT: ${{ secrets.CF_TUNNEL_UUID_CONTENT }}
        run: |
          set +e
          cd "$GITHUB_WORKSPACE"

          if [ -z "$CF_TUNNEL_UUID" ]; then
            echo "CF_TUNNEL_UUID is empty. Check secret CF_TUNNEL_UUID_1."
            exit 1
          fi

          if [ -z "$CF_TUNNEL_UUID_CONTENT" ]; then
            echo "CF_TUNNEL_UUID_CONTENT is empty."
            exit 1
          fi

          mkdir -p ~/.cloudflared
          echo "$CF_TUNNEL_CERT" > ~/.cloudflared/cert.pem
          echo "$CF_TUNNEL_UUID_CONTENT" > credentials.json

          cat > tunnel-config.yml <<EOF
          tunnel: ${CF_TUNNEL_UUID}
          credentials-file: ${GITHUB_WORKSPACE}/credentials.json

          ingress:
            - service: tcp://localhost:25565
          EOF

          start_spigot() {
            echo "Starting Spigot..."
            java \
              -XX:+UseG1GC \
              -XX:+ParallelRefProcEnabled \
              -XX:MaxGCPauseMillis=200 \
              -XX:+UnlockExperimentalVMOptions \
              -XX:+DisableExplicitGC \
              -XX:+AlwaysPreTouch \
              -XX:G1NewSizePercent=30 \
              -XX:G1MaxNewSizePercent=40 \
              -XX:G1HeapRegionSize=8M \
              -XX:G1ReservePercent=20 \
              -XX:G1HeapWastePercent=5 \
              -XX:G1MixedGCCountTarget=4 \
              -XX:InitiatingHeapOccupancyPercent=15 \
              -XX:G1MixedGCLiveThresholdPercent=90 \
              -XX:G1RSetUpdatingPauseTimePercent=5 \
              -XX:SurvivorRatio=32 \
              -XX:+PerfDisableSharedMem \
              -XX:MaxTenuringThreshold=1 \
              -Dusing.aikars.flags=https://mcflags.emc.gs \
              -Daikars.new.flags=true \
              -Xms16G \
              -Xmx16G \
              -jar spigot.jar nogui 2>&1 | sed '/login:/s/.*/<REDACTED>/' &

            SPIGOT_PID=$!
            echo "Spigot started with PID $SPIGOT_PID"
          }

          start_cloudflared() {
            echo "Starting Cloudflare Tunnel..."
            cloudflared tunnel --config tunnel-config.yml run &
            CLOUDFLARED_PID=$!
            echo "Cloudflare Tunnel started with PID $CLOUDFLARED_PID"
          }

          commit_and_push() {
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"

            git add -A

            git reset -- tunnel-config.yml
            git reset -- credentials.json
            git reset -- logs/

            if git diff --cached --quiet; then
              echo "No changes to commit"
              return 0
            fi

            if ! git commit -m "Auto commit every 30 seconds [no ci]"; then
              echo "Commit failed"
              return 1
            fi

            for i in 1 2 3; do
              if git push "https://x-access-token:${FINE_GRAINED_PAT}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main; then
                echo "Push successful on attempt $i"
                return 0
              else
                echo "Push failed on attempt $i"
                git pull --rebase || true
              fi
            done

            echo "Failed to push after 3 attempts"
            return 1
          }

          create_new_workflow_run() {
            echo "Creating new workflow run..."

            curl -i -X POST \
              -H "Authorization: Bearer ${FINE_GRAINED_PAT}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/workflows/CI.yml/dispatches" \
              -d '{"ref":"main"}'
          }

          cancel_old_workflow_runs() {
            current_run_id="$GITHUB_RUN_ID"

            workflow_runs=$(curl -s \
              -H "Authorization: Bearer ${FINE_GRAINED_PAT}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/actions/runs?branch=main&status=in_progress")

            echo "$workflow_runs" | jq -r ".workflow_runs[] | select(.id != ${current_run_id}) | .id" | while read -r run_id; do
              echo "Cancelling workflow run $run_id"

              curl -s -X POST \
                -H "Authorization: Bearer ${FINE_GRAINED_PAT}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPO}/actions/runs/${run_id}/cancel"
            done
          }

          delete_auto_commit_workflows() {
            workflow_runs=$(curl -s \
              -H "Authorization: Bearer ${FINE_GRAINED_PAT}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/actions/runs")

            echo "$workflow_runs" | jq -r '.workflow_runs[] | select(.head_commit.message | contains("Auto commit every 30 seconds")) | .id' | while read -r run_id; do
              echo "Deleting workflow run $run_id"

              curl -s -X DELETE \
                -H "Authorization: Bearer ${FINE_GRAINED_PAT}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPO}/actions/runs/${run_id}"
            done
          }

          start_spigot
          start_cloudflared

          START_TIME=$(date +%s)

          sleep 30 && cancel_old_workflow_runs &

          while true; do
            commit_and_push || echo "Commit/push failed, continuing"
            delete_auto_commit_workflows || true

            CURRENT_TIME=$(date +%s)
            ELAPSED_TIME=$((CURRENT_TIME - START_TIME))

            if ! kill -0 "$SPIGOT_PID" 2>/dev/null; then
              echo "Spigot stopped. Restarting..."
              start_spigot
            fi

            if ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then
              echo "Cloudflare Tunnel stopped."
              create_new_workflow_run
              exit 0
            fi

            if [ "$ELAPSED_TIME" -ge 18000 ]; then
              echo "Workflow has been running for 5 hours."
              create_new_workflow_run
              exit 0
            fi

            sleep 30
          done

      - name: Rerun workflow if previous step failed
        if: failure()
        env:
          FINE_GRAINED_PAT: ${{ secrets.FINE_GRAINED_PAT }}
          REPO: ${{ github.repository }}
        run: |
          curl -i -X POST \
            -H "Authorization: Bearer ${FINE_GRAINED_PAT}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/CI.yml/dispatches" \
            -d '{"ref":"main"}'

          echo "Workflow rerun triggered due to previous step failure"
