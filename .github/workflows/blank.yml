name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'  # Run every 5 hours

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: true
          token: ${{ secrets.FINE_GRAINED_PAT }}

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '22'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add Cloudflare repository
        run: |
          sudo mkdir -p --mode=0755 /usr/share/keyrings
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared jammy main' | sudo tee /etc/apt/sources.list.d/cloudflared.list
          sudo apt-get update

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: cloudflared jq
          version: 1.0

      - name: Debug - List directory contents
        run: ls -la

      - name: Run Spigot and cloudflared with auto-restart and workflow recreation
        if: "!contains(github.event.head_commit.message, 'Auto commit every 30 seconds [no ci]')"
        continue-on-error: true
        env:
          FINE_GRAINED_PAT: ${{ secrets.FINE_GRAINED_PAT }}
          REPO: ${{ github.repository }}
          CF_TUNNEL_CERT: ${{ secrets.CF_CERT }}
          CF_TUNNEL_UUID: ${{ secrets.CF_TUNNEL_UUID_1 }}
          CF_TUNNEL_UUID_CONTENT: ${{ secrets.CF_TUNNEL_UUID_CONTENT }}
        run: |
          set +e

          cd "$GITHUB_WORKSPACE"

          mkdir -p ~/.cloudflared

          echo "Writing Cloudflare cert..."
          printf '%s' "$CF_TUNNEL_CERT" > ~/.cloudflared/cert.pem

          echo "Writing Cloudflare tunnel credentials..."
          printf '%s' "$CF_TUNNEL_UUID_CONTENT" > credentials.json

          echo "Validating credentials.json..."
          if ! jq empty credentials.json >/dev/null 2>&1; then
            echo "ERROR: credentials.json is not valid JSON."
            echo "This usually means CF_TUNNEL_UUID_CONTENT is not the full Cloudflare credentials JSON."
            echo "It must be the JSON file created by: cloudflared tunnel create"
            echo "Expected top-level JSON keys are usually: AccountTag, TunnelSecret, TunnelID"
            echo "Showing only file size, not secret contents:"
            wc -c credentials.json
            exit 1
          fi

          echo "credentials.json is valid JSON."
          echo "Credentials JSON keys:"
          jq -r 'keys[]' credentials.json

          echo "Creating tunnel-config.yml..."
          cat > tunnel-config.yml <<EOF
          url: tcp://localhost:25565
          tunnel: ${CF_TUNNEL_UUID}
          credentials-file: credentials.json
          EOF

          echo "Validating tunnel config..."
          cat tunnel-config.yml

          start_spigot() {
            echo "Starting Spigot..."

            java \
              -XX:+UseG1GC \
              -XX:+ParallelRefProcEnabled \
              -XX:MaxGCPauseMillis=200 \
              -XX:+UnlockExperimentalVMOptions \
              -XX:+DisableExplicitGC \
              -XX:+AlwaysPreTouch \
              -XX:G1NewSizePercent=30 \
              -XX:G1MaxNewSizePercent=40 \
              -XX:G1HeapRegionSize=8M \
              -XX:G1ReservePercent=20 \
              -XX:G1HeapWastePercent=5 \
              -XX:G1MixedGCCountTarget=4 \
              -XX:InitiatingHeapOccupancyPercent=15 \
              -XX:G1MixedGCLiveThresholdPercent=90 \
              -XX:G1RSetUpdatingPauseTimePercent=5 \
              -XX:SurvivorRatio=32 \
              -XX:+PerfDisableSharedMem \
              -XX:MaxTenuringThreshold=1 \
              -Dusing.aikars.flags=https://mcflags.emc.gs \
              -Daikars.new.flags=true \
              -Xms16G \
              -Xmx16G \
              -jar spigot.jar nogui 2>&1 | sed '/login:/s/.*/<REDACTED>/' &

            SPIGOT_PID=$!
            echo "Spigot started with PID $SPIGOT_PID"
          }

          start_cloudflared() {
            echo "Starting Cloudflare Tunnel..."
            cloudflared tunnel --config tunnel-config.yml run "$CF_TUNNEL_UUID" &
            CLOUDFLARED_PID=$!
            echo "Cloudflare Tunnel started with PID $CLOUDFLARED_PID"
          }

          commit_and_push() {
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"

            git add -A

            # Never commit generated secret/config/log files
            git reset -- tunnel-config.yml 2>/dev/null
            git reset -- credentials.json 2>/dev/null
            git reset -- logs/ 2>/dev/null

            if ! git commit -m "Auto commit every 30 seconds [no ci]"; then
              echo "No changes to commit or commit failed"
              return 1
            fi

            for i in {1..3}; do
              echo "Pushing changes, attempt $i..."

              if git push "https://x-access-token:${FINE_GRAINED_PAT}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main --force; then
                echo "Push successful on attempt $i"
                return 0
              else
                echo "Push failed on attempt $i, retrying..."
                git pull --rebase
              fi
            done

            echo "Failed to push after 3 attempts"
            return 1
          }

          delete_auto_commit_workflows() {
            echo "Deleting old auto-commit workflow runs..."

            workflow_ids=$(curl -sS \
              -H "Authorization: Bearer $FINE_GRAINED_PAT" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/actions/runs" | \
              jq -r '.workflow_runs[]? | select(.head_commit.message | contains("Auto commit every 30 seconds")) | .id')

            for id in $workflow_ids; do
              echo "Deleting workflow run $id"

              curl -sS -X DELETE \
                -H "Authorization: Bearer $FINE_GRAINED_PAT" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPO}/actions/runs/$id" >/dev/null
            done
          }

          create_new_workflow_run() {
            echo "Finding workflow ID for .github/workflows/CI.yml..."

            WORKFLOW_ID=$(curl -sS \
              -H "Authorization: Bearer $FINE_GRAINED_PAT" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/actions/workflows" | \
              jq -r '.workflows[]? | select(.path == ".github/workflows/CI.yml") | .id')

            if [ -z "$WORKFLOW_ID" ] || [ "$WORKFLOW_ID" = "null" ]; then
              echo "ERROR: Could not find workflow at .github/workflows/CI.yml"
              echo "Available workflows:"
              curl -sS \
                -H "Authorization: Bearer $FINE_GRAINED_PAT" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPO}/actions/workflows" | \
                jq -r '.workflows[]? | "\(.id) | \(.name) | \(.path) | \(.state)"'
              return 1
            fi

            echo "Dispatching workflow ID $WORKFLOW_ID..."

            RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST \
              -H "Authorization: Bearer $FINE_GRAINED_PAT" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/actions/workflows/${WORKFLOW_ID}/dispatches" \
              -d '{"ref":"main"}')

            STATUS=$(echo "$RESPONSE" | sed -n 's/HTTP_STATUS://p')
            BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')

            if [ "$STATUS" != "204" ]; then
              echo "ERROR: Workflow dispatch failed with HTTP status $STATUS"
              echo "$BODY"
              return 1
            fi

            echo "New workflow run created successfully"
            return 0
          }

          cancel_old_workflow_runs() {
            echo "Cancelling old in-progress workflow runs..."

            current_run_id="$GITHUB_RUN_ID"

            workflow_runs=$(curl -sS \
              -H "Authorization: Bearer $FINE_GRAINED_PAT" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/actions/runs?branch=main&status=in_progress")

            echo "$workflow_runs" | jq -r ".workflow_runs[]? | select(.id != $current_run_id) | .id" | while read -r run_id; do
              echo "Cancelling workflow run $run_id"

              curl -sS -X POST \
                -H "Authorization: Bearer $FINE_GRAINED_PAT" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPO}/actions/runs/$run_id/cancel" >/dev/null
            done
          }

          start_spigot
          start_cloudflared

          START_TIME=$(date +%s)

          # Cancel older runs after startup
          (sleep 30 && cancel_old_workflow_runs) &

          # Remove local credentials file after cloudflared has started
          # cloudflared should already have read it by then
          (sleep 20 && rm -f credentials.json) &

          while true; do
            if ! commit_and_push; then
              echo "Commit and push failed, continuing without stopping the workflow"
            fi

            delete_auto_commit_workflows

            CURRENT_TIME=$(date +%s)
            ELAPSED_TIME=$((CURRENT_TIME - START_TIME))

            if ! kill -0 "$SPIGOT_PID" 2>/dev/null; then
              echo "Spigot process has stopped. Restarting Spigot..."
              start_spigot
            fi

            if ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null || [ "$ELAPSED_TIME" -ge 18000 ]; then
              if ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then
                echo "Cloudflare Tunnel process has stopped."
              else
                echo "Workflow has been running for 5 hours."
              fi

              echo "Creating new workflow run and exiting current one."

              if create_new_workflow_run; then
                exit 0
              else
                echo "Failed to create new workflow run."
                exit 1
              fi
            fi

            sleep 30
          done

      - name: Rerun workflow if previous step failed
        if: failure()
        env:
          FINE_GRAINED_PAT: ${{ secrets.FINE_GRAINED_PAT }}
          REPO: ${{ github.repository }}
        run: |
          echo "Finding workflow ID for rerun..."

          WORKFLOW_ID=$(curl -sS \
            -H "Authorization: Bearer $FINE_GRAINED_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/workflows" | \
            jq -r '.workflows[]? | select(.path == ".github/workflows/CI.yml") | .id')

          if [ -z "$WORKFLOW_ID" ] || [ "$WORKFLOW_ID" = "null" ]; then
            echo "ERROR: Could not find workflow at .github/workflows/CI.yml"
            echo "Available workflows:"
            curl -sS \
              -H "Authorization: Bearer $FINE_GRAINED_PAT" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/actions/workflows" | \
              jq -r '.workflows[]? | "\(.id) | \(.name) | \(.path) | \(.state)"'
            exit 1
          fi

          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Authorization: Bearer $FINE_GRAINED_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/workflows/${WORKFLOW_ID}/dispatches" \
            -d '{"ref":"main"}')

          STATUS=$(echo "$RESPONSE" | sed -n 's/HTTP_STATUS://p')
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')

          if [ "$STATUS" != "204" ]; then
            echo "ERROR: Workflow rerun dispatch failed with HTTP status $STATUS"
            echo "$BODY"
            exit 1
          fi

          echo "Workflow rerun triggered due to previous step failure"
